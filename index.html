<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f4f6" />
  <title>今天去哪吃</title>
  <style>
    :root { --orange:#ff8a00; --orange-dark:#ee7200; --ink:#242424; --muted:#8b8b8b; --line:#e7e7e7; --surface:#fff; --page:#f3f4f6; --soft:#f7f7f8; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:#e7e9ec; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; }
    body { display:flex; justify-content:center; padding:12px; }
    button, input, select { font:inherit; }
    button { cursor:pointer; }
    .app { width:min(430px,100%); min-height:calc(100vh - 24px); background:var(--page); border-radius:34px 34px 0 0; overflow:hidden; box-shadow:0 8px 30px #00000017; position:relative; display:flex; flex-direction:column; }
    .topbar { height:68px; flex:none; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:#fff; border-bottom:1px solid var(--line); }

    .top-actions { display:flex; gap:9px; }

    .group-pill { max-width:156px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border:0; border-radius:18px; background:#fff3e6; color:#d76b00; padding:8px 11px; font-size:12px; font-weight:700; }
    .content { flex:1; overflow:auto; padding-bottom:90px; }
    .view { display:none; padding:18px 16px 0; }
    .view.active { display:block; }
    .location-card { background:#fff; border-radius:16px; padding:13px 16px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 4px 12px #00000008; }
    .location { font-size:13px; color:#424242; }
    .weather { color:var(--orange-dark); font-weight:800; }
    .weather small { background:#fff2e5; color:#a6784e; font-weight:600; padding:4px 7px; border-radius:10px; margin-left:6px; }
    .hero { min-height:220px; margin-top:16px; border-radius:24px; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 7px 18px #0000000b; text-align:center; padding:20px; }
    .dice { width:68px; height:68px; perspective:420px; transform-style:preserve-3d; display:grid; place-items:center; margin-bottom:20px; filter:drop-shadow(0 8px 5px #0002); }
    .dice-cube { position:relative; width:52px; height:52px; transform-style:preserve-3d; transform:rotateX(-20deg) rotateY(32deg); will-change:transform; }
    .face { position:absolute; inset:0; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); padding:7px; border:1px solid #c7c7c7; border-radius:9px; background:linear-gradient(145deg,#fff 8%,#ededed 58%,#cecece); box-shadow:inset 2px 2px 5px #fff,inset -2px -2px 5px #aaa5; backface-visibility:hidden; }
    .face.front { transform:translateZ(26px); }
    .face.back { transform:rotateY(180deg) translateZ(26px); }
    .face.right { transform:rotateY(90deg) translateZ(26px); }
    .face.left { transform:rotateY(-90deg) translateZ(26px); }
    .face.top { transform:rotateX(90deg) translateZ(26px); }
    .face.bottom { transform:rotateX(-90deg) translateZ(26px); }
    .dot { width:8px; height:8px; border-radius:50%; background:#313131; align-self:center; justify-self:center; box-shadow:inset 1px 1px 2px #0009,0 1px 1px #fff; }
    .front .dot, .top .dot { background:#e83d38; }
    .p1 { grid-area:1/1; } .p2 { grid-area:1/2; } .p3 { grid-area:1/3; }
    .p4 { grid-area:2/1; } .p5 { grid-area:2/2; } .p6 { grid-area:2/3; }
    .p7 { grid-area:3/1; } .p8 { grid-area:3/2; } .p9 { grid-area:3/3; }
    .result { min-height:29px; font-size:17px; font-weight:750; color:#555; }
    .result.highlight { color:#f07800; font-size:22px; }
    .hint { color:#a1a1a1; font-size:14px; }
    .pick-main { margin-top:16px; width:100%; border:0; border-radius:15px; padding:15px; color:#fff; background:linear-gradient(120deg,#ff9700,#ff7900); font-weight:800; box-shadow:0 7px 13px #ff8a0040; }
    .pick-main:active { transform:translateY(1px); }
    .pick-main:disabled, .quick:disabled { opacity:.62; cursor:wait; }
    .quick-row { display:grid; grid-template-columns:1fr 1.18fr 1fr; gap:10px; margin-top:15px; }
    .quick { border:1px solid #e4e5e7; border-radius:15px; background:#f8f9fa; color:#555; padding:13px 8px; font-weight:700; font-size:13px; }
    .quick.primary { color:#fff; background:var(--orange); border-color:var(--orange); box-shadow:0 7px 12px #ff8a0036; }
    .quick span { display:block; font-size:20px; margin-bottom:5px; }
    .chat { background:#fff; border-radius:18px; padding:13px 14px; margin-top:15px; color:#777; font-size:13px; }
    .chat b { color:#555; background:#fff1e2; padding:4px 7px; border-radius:5px; margin-right:3px; }
    .section-head { display:flex; justify-content:space-between; align-items:center; margin:0 2px 12px; }
    .section-title { margin:0; font-size:20px; font-weight:850; }
    .section-sub { color:var(--muted); font-size:12px; }
    .toolbar { display:grid; grid-template-columns:1fr 108px; gap:9px; margin-bottom:10px; }
    .input, .select { width:100%; border:1px solid #e0e1e3; border-radius:12px; background:#fff; padding:11px 12px; outline:0; }
    .input:focus { border-color:#ffad4b; box-shadow:0 0 0 3px #ffad4b22; }
    .orange-btn { width:100%; border:0; border-radius:12px; background:var(--orange); color:#fff; padding:11px 12px; font-weight:800; }
    .outline-btn { border:1px solid #e1e2e4; border-radius:10px; background:#fff; color:#555; padding:8px 10px; }
    .danger-btn { border:1px solid #ffc5c5; border-radius:10px; background:#fff; color:#ee5555; padding:8px 10px; }
    .restaurant-list { display:grid; gap:12px; margin-top:12px; }
    .restaurant-card { background:#fff; border-radius:17px; padding:15px 14px 13px; box-shadow:0 5px 15px #00000008; }

    .restaurant-name { font-size:16px; font-weight:800; }
    .r-actions { display:flex; gap:7px; }
    .meta { color:#969696; font-size:12px; margin-top:7px; }
    .tag { display:inline-block; margin:8px 5px 0 0; padding:4px 8px; background:#f1f2f3; color:#666; border-radius:9px; font-size:11px; }
    .featured { background:#fff0dc; color:#db7300; font-weight:750; }
    .rating-row { margin-top:11px; padding-top:10px; border-top:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .stars { display:flex; align-items:center; gap:1px; }
    .star { border:0; background:transparent; color:#d3d3d3; font-size:21px; line-height:1; padding:2px; }
    .star.selected { color:#ff9900; text-shadow:0 1px 2px #ff990055; }
    .rating-copy { color:#858585; font-size:11px; white-space:nowrap; }
    .visit-btn { border:1px solid #ffd49e; border-radius:10px; background:#fff9f0; color:#d97700; padding:7px 9px; font-size:12px; }
    .card-foot { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:9px; }
    .empty { text-align:center; color:#999; padding:50px 0; }
    .stats-grid { display:grid; gap:14px; }
    .stat-card { background:#fff; border-radius:18px; padding:17px 16px; box-shadow:0 5px 15px #00000008; }
    .stat-card h3 { font-size:15px; margin:0 0 12px; padding-bottom:10px; border-bottom:1px solid var(--line); }
    .rank { display:flex; justify-content:space-between; padding:11px 12px; background:#f5f6f7; border-radius:12px; margin-top:9px; font-size:13px; }
    .rank b { color:var(--orange-dark); }
    .big-stat { text-align:center; padding:25px 10px; }
    .big-stat strong { display:block; font-size:38px; color:var(--orange); line-height:1; margin-bottom:8px; }
    .big-stat span { color:#999; font-size:13px; }
    .history-list { display:grid; gap:10px; }
    .history-item { background:#fff; border-radius:14px; padding:13px 14px; display:flex; justify-content:space-between; align-items:center; }
    .history-item strong { font-size:15px; }
    .history-item small { color:#999; }
    .bottom-nav { position:absolute; bottom:0; left:0; right:0; height:76px; background:#fff; border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); padding:7px 9px max(7px,env(safe-area-inset-bottom)); }
    .nav-btn { border:0; background:transparent; color:#777; border-radius:16px; font-size:11px; font-weight:650; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
    .nav-btn span { font-size:22px; line-height:1; }
    .nav-btn.active { color:#fff; background:var(--orange); }
    .drawer-backdrop { display:none; position:absolute; inset:0; background:#0005; z-index:5; align-items:flex-end; }
    .drawer-backdrop.open { display:flex; }
    .drawer { width:100%; max-height:86%; overflow:auto; background:#fff; border-radius:24px 24px 0 0; padding:18px 16px 26px; animation:up .2s ease-out; }
    @keyframes up { from { transform:translateY(20px); opacity:.4; } to { transform:none; opacity:1; } }
    .drawer-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .drawer-head h2 { margin:0; font-size:19px; }
    .close { border:0; background:#f3f4f5; border-radius:50%; width:30px; height:30px; color:#666; }
    .current-group-card { background:linear-gradient(145deg,#fff8ee,#fff); border:1px solid #ffd09a; border-radius:18px; padding:15px; margin-bottom:12px; }
    .current-group-top { display:flex; justify-content:space-between; align-items:center; color:#d87500; font-size:12px; font-weight:750; }
    .current-group-card h3 { margin:8px 0 12px; font-size:22px; }
    .group-code-row { display:flex; align-items:center; gap:8px; color:#777; font-size:13px; }
    .group-code-row strong { color:#333; font-size:16px; letter-spacing:1px; }
    .mini-copy { border:0; border-radius:8px; background:#fff; color:#dd7800; padding:5px 8px; font-size:11px; }
    .invite-card { background:#f7f8f9; border-radius:15px; padding:12px; margin-bottom:12px; }
    .invite-card h3 { margin:0 0 8px; font-size:14px; }
    .invite-copy { color:#777; font-size:12px; line-height:1.5; word-break:break-all; margin-bottom:9px; }
    .invite-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .section-label { display:flex; justify-content:space-between; align-items:center; margin:14px 2px 8px; font-size:14px; font-weight:800; }
    .section-label small { color:#999; font-weight:500; }
    .group-list { display:grid; gap:9px; margin-bottom:16px; }
    .group-option { border:1px solid #e8e8e8; border-radius:14px; background:#fff; padding:12px; display:flex; justify-content:space-between; align-items:center; text-align:left; }
    .group-option.current { border-color:#ffb45e; background:#fff8ee; }
    .group-option strong { display:block; font-size:14px; }
    .group-option small { color:#999; display:block; margin-top:4px; }
    .member-list { display:flex; flex-wrap:wrap; gap:6px; }
    .member-chip { padding:5px 8px; border-radius:10px; background:#fff; border:1px solid #e7e7e7; color:#666; font-size:11px; }
    .member-summary { color:#777; font-size:12px; }
    .check { color:var(--orange); font-size:18px; }
    .drawer-form { background:#f7f8f9; border-radius:15px; padding:12px; display:grid; gap:9px; }
    .drawer-form h3 { margin:0; font-size:14px; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .form-actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .status { min-height:18px; margin:9px 2px 0; font-size:12px; color:#777; }
    .ok { color:#18885e; } .warn { color:#b46b10; } .fail { color:#d74444; }
    .import-box { margin-top:12px; padding-top:12px; border-top:1px solid var(--line); display:grid; gap:8px; }
    .import-box summary { cursor:pointer; color:#666; font-size:13px; }
    code { background:#f3f4f5; border-radius:5px; padding:2px 4px; }
    @keyframes diceHop { 0%,100%{transform:translateY(0) scale(1)} 13%{transform:translateY(-16px) scale(1.06)} 27%{transform:translateY(11px) scale(.96)} 42%{transform:translateY(-14px) scale(1.05)} 58%{transform:translateY(10px) scale(.97)} 73%{transform:translateY(-9px) scale(1.03)} 87%{transform:translateY(5px) scale(.99)} }
    @keyframes cubeRoll { 0%{transform:rotateX(-20deg) rotateY(32deg)} 16%{transform:rotateX(160deg) rotateY(32deg)} 33%{transform:rotateX(340deg) rotateY(32deg)} 50%{transform:rotateX(520deg) rotateY(32deg)} 67%{transform:rotateX(700deg) rotateY(32deg)} 84%{transform:rotateX(880deg) rotateY(32deg)} 100%{transform:rotateX(1060deg) rotateY(32deg)} }
    .dice.rolling { animation:diceHop 2s ease-in-out; }
    .dice.rolling .dice-cube { animation:cubeRoll 2s linear; }
    @media (max-width:450px) { body { padding:0; } .app { min-height:100vh; border-radius:0; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><div class="brand"><span>🍽️</span>今天去哪吃</div><div class="top-actions"><button class="group-pill" id="groupOpenBtn" title="切换吃饭群">默认吃饭群</button><button class="icon-btn" id="helpBtn" aria-label="使用说明">?</button></div></header>
    <div class="content">
      <section class="view active" data-view="pick"><div class="location-card"><span class="location">📍 上海 · 今天</span><span class="weather">☁️ 21°C <small>雷阵雨</small></span></div><div class="hero"><div class="dice" id="dice" aria-label="三维骰子"><div class="dice-cube"><span class="face front"><i class="dot p5"></i></span><span class="face back"><i class="dot p1"></i><i class="dot p3"></i><i class="dot p4"></i><i class="dot p6"></i><i class="dot p7"></i><i class="dot p9"></i></span><span class="face right"><i class="dot p1"></i><i class="dot p5"></i><i class="dot p9"></i></span><span class="face left"><i class="dot p1"></i><i class="dot p3"></i><i class="dot p7"></i><i class="dot p9"></i></span><span class="face top"><i class="dot p1"></i><i class="dot p9"></i></span><span class="face bottom"><i class="dot p1"></i><i class="dot p3"></i><i class="dot p5"></i><i class="dot p7"></i><i class="dot p9"></i></span></div></div><div class="result" id="result">点击“开始吧！”决定今天吃什么</div><div class="hint" id="countTip"></div></div><button class="pick-main" id="pickBtn">开始吧！</button><div class="chat"><b>不想挑</b><span>你也就配吃食堂</span></div><div class="quick-row"><button class="quick" id="rerollBtn"><span>🔄</span>换一个</button><button class="quick primary" id="quickPickBtn"><span>🎲</span>开始吧！</button><button class="quick" id="doneBtn"><span>✅</span>就它了！</button></div></section>
      <section class="view" data-view="foods"><div class="section-head"><h2 class="section-title">🍴 群组餐厅库 <span id="listLen">(0)</span></h2><span class="section-sub" id="foodGroupTip"></span></div><div class="toolbar"><input class="input" id="searchInput" placeholder="搜索餐厅…" /><select class="select" id="categorySelect"><option value="">全部类型</option></select></div><button class="orange-btn" id="showAddBtn">＋ 添加餐厅</button><div id="addPanel" class="drawer-form" style="display:none;margin:12px 0 0"><h3>新增餐厅 / 菜品</h3><div class="form-row"><input class="input" id="nameInput" placeholder="名称，如：大米先生" /><input class="input" id="catInput" placeholder="类型，如：米饭类" /></div><button class="orange-btn" id="addBtn">保存到当前群</button></div><details class="import-box"><summary>导入 / 导出当前群数据</summary><div class="status">支持 JSON 数组或 CSV（name,category）。导入会覆盖当前群餐厅，并清空旧餐厅的评分与到访记录。</div><input id="fileInput" class="input" type="file" accept=".json,.csv,text/csv,application/json" /><div class="form-actions"><button class="outline-btn" id="importBtn">导入</button><button class="outline-btn" id="exportBtn">导出 JSON</button></div></details><div class="status" id="importStatus"></div><div class="restaurant-list" id="listWrap"></div></section>
      <section class="view" data-view="stats"><div class="section-head"><h2 class="section-title">📊 群组精选</h2><span class="section-sub" id="statsGroupTip"></span></div><div class="stats-grid"><div class="stat-card"><h3>群友精选餐厅</h3><div id="rankList"></div></div><div class="stat-card big-stat"><strong id="mealTotal">0</strong><span>群组餐厅总数</span></div><div class="stat-card big-stat"><strong id="pickTotal">0</strong><span>群组累计到访</span></div></div></section>
      <section class="view" data-view="history"><div class="section-head"><h2 class="section-title">📜 我的抽选历史</h2><button class="outline-btn" id="clearHistoryBtn">清空</button></div><div class="history-list" id="historyList"></div></section>
    </div>
    <nav class="bottom-nav" aria-label="主导航"><button class="nav-btn active" data-target="pick"><span>🏷️</span>抽选</button><button class="nav-btn" data-target="foods"><span>🍴</span>餐厅</button><button class="nav-btn" data-target="stats"><span>☷</span>统计</button><button class="nav-btn" data-target="history"><span>⏱️</span>历史</button></nav>
    <div class="drawer-backdrop" id="groupBackdrop"><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="groupTitle"><div class="drawer-head"><h2 id="groupTitle">我的吃饭群</h2><button class="close" id="closeGroupBtn">×</button></div><div class="current-group-card"><div class="current-group-top"><span>当前群</span><span id="currentMemberCount">0 位成员</span></div><h3 id="currentGroupTitle">默认吃饭群</h3><div class="group-code-row"><span>群码</span><strong id="currentGroupCode">default</strong><button class="mini-copy" id="copyCodeBtn">复制</button></div></div><div class="invite-card"><h3>本群邀请成员</h3><div class="invite-copy" id="inviteText">打开页面，输入群码加入本群。</div><div class="invite-actions"><button class="outline-btn" id="copyInviteBtn">复制邀请文案</button><button class="orange-btn" id="inviteBtn">邀请成员</button></div></div><div class="section-label"><span>本群成员</span><small id="memberSummary">0 位成员</small></div><div class="member-list" id="memberList"></div><div class="section-label"><span>我的吃饭群</span><small>点击切换</small></div><div class="group-list" id="groupList"></div><div class="drawer-form"><h3>创建新群</h3><div class="form-row"><input class="input" id="newGroupName" placeholder="群名，如：周末吃饭搭子" /><input class="input" id="newGroupCode" placeholder="自定义群码（可选）" /></div><button class="orange-btn" id="createGroupBtn">创建并切换</button></div><div class="drawer-form" style="margin-top:10px"><h3>加入已有群</h3><div class="form-row"><input class="input" id="joinCode" placeholder="输入群码" /><button class="orange-btn" id="joinGroupBtn">加入群</button></div></div><p class="status" id="groupStatus"></p></section></div>
  </main>
  <script>
    const API_BASE=location.origin.startsWith('file:')?'http://127.0.0.1:3000':location.origin, GROUP_KEY='wte-current-group-v2', HISTORY_KEY='wte-history-v2', MEMBER_TOKEN_KEY='wte-member-token-v1', MEMBER_NAME_KEY='wte-member-name-v1'; let groups=[],foods=[],members=[],currentGroupId=null;
    let memberToken=localStorage.getItem(MEMBER_TOKEN_KEY)||((globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():`member-${Date.now()}-${Math.random().toString(16).slice(2)}`);localStorage.setItem(MEMBER_TOKEN_KEY,memberToken);let memberName=localStorage.getItem(MEMBER_NAME_KEY)||`搭子${memberToken.replace(/-/g,'').slice(-4)}`;localStorage.setItem(MEMBER_NAME_KEY,memberName);
    const $=id=>document.getElementById(id), els={groupOpenBtn:$('groupOpenBtn'),groupBackdrop:$('groupBackdrop'),groupList:$('groupList'),groupStatus:$('groupStatus'),currentGroupTitle:$('currentGroupTitle'),currentGroupCode:$('currentGroupCode'),currentMemberCount:$('currentMemberCount'),inviteText:$('inviteText'),memberSummary:$('memberSummary'),memberList:$('memberList'),result:$('result'),dice:$('dice'),countTip:$('countTip'),listWrap:$('listWrap'),listLen:$('listLen'),importStatus:$('importStatus'),search:$('searchInput'),category:$('categorySelect'),rankList:$('rankList'),mealTotal:$('mealTotal'),pickTotal:$('pickTotal'),historyList:$('historyList')};
    let isPicking=false;
    function setStatus(el,text,type=''){el.textContent=text||'';el.className=`status ${type}`;} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));} function queryUrl(path){const parts=path.split('?'),q=new URLSearchParams(parts[1]||'');if(currentGroupId)q.set('groupId',String(currentGroupId));q.set('memberToken',memberToken);return `${API_BASE}${parts[0]}?${q.toString()}`;} async function api(path,options={}){const res=await fetch(queryUrl(path),{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});if(!res.ok)throw Error(await res.text().catch(()=>`HTTP ${res.status}`));return res.json();} function memberPayload(extra={}){return{memberToken,memberName,...extra};} function currentGroup(){return groups.find(g=>g.id===Number(currentGroupId))||groups[0];} function groupHistory(){try{const all=JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}');return Array.isArray(all[currentGroupId])?all[currentGroupId]:[]}catch{return[];}} function saveHistory(items){let all={};try{all=JSON.parse(localStorage.getItem(HISTORY_KEY)||'{}')}catch{}all[currentGroupId]=items.slice(0,50);localStorage.setItem(HISTORY_KEY,JSON.stringify(all));}
    async function loadGroups(selectId){const data=await api('/api/groups');groups=data.groups||[];const cached=Number(localStorage.getItem(GROUP_KEY));const target=groups.find(g=>g.id===Number(selectId))||groups.find(g=>g.id===cached)||groups[0];if(target)await setGroup(target.id,false);renderGroupList();} async function ensureMembership(){if(!currentGroupId)return null;const groupId=currentGroupId,data=await api(`/api/groups/${groupId}/join`,{method:'POST',body:JSON.stringify(memberPayload())});if(currentGroupId!==groupId)return null;const i=groups.findIndex(g=>g.id===groupId);if(i>=0&&data.group)groups[i]=data.group;return data.member;} async function loadMembers(){if(!currentGroupId)return;const groupId=currentGroupId;try{const data=await api(`/api/groups/${groupId}/members`);if(currentGroupId!==groupId)return;members=data.members||[];renderMembers();}catch{if(currentGroupId!==groupId)return;members=[];renderMembers();}} function renderMembers(){els.memberSummary.textContent=`${members.length} 位成员`;els.currentMemberCount.textContent=`${members.length} 位成员`;els.memberList.innerHTML=members.map((m,index)=>`<span class="member-chip">群成员 ${index+1} · ${Number(m.rating_count)||0}次评分 / ${Number(m.visit_count)||0}次到访</span>`).join('')||'<span class="member-chip">还没有群成员</span>';} function updateInviteCard(group){if(!group)return;els.currentGroupTitle.textContent=group.name;els.currentGroupCode.textContent=group.code;els.currentMemberCount.textContent=`${Number(group.member_count)||members.length} 位成员`;const linkBase=location.origin.startsWith('file:')?'http://localhost:3000':location.origin;els.inviteText.textContent=`邀请加入「${group.name}」：打开 ${linkBase}/，输入群码 ${group.code}。`;} async function setGroup(id,announce=true){const target=groups.find(g=>g.id===Number(id));if(!target)return;currentGroupId=target.id;localStorage.setItem(GROUP_KEY,String(currentGroupId));els.groupOpenBtn.textContent=`${target.name} · ${target.code}`;$('foodGroupTip').textContent=target.name;$('statsGroupTip').textContent=target.name;updateInviteCard(target);await ensureMembership();if(currentGroupId!==target.id)return;await Promise.all([loadFoods(),loadMembers()]);renderGroupList();if(announce){els.groupBackdrop.classList.remove('open');setStatus(els.groupStatus,`已切换到「${target.name}」`,'ok');}} function renderGroupList(){els.groupList.innerHTML=groups.map(g=>`<button class="group-option ${g.id===currentGroupId?'current':''}" data-group-id="${g.id}"><span><strong>${esc(g.name)}</strong><small>群码：${esc(g.code)} · ${Number(g.member_count)||0} 位成员</small></span>${g.id===currentGroupId?'<span class="check">✓</span>':''}</button>`).join('')||'<div class="empty">还没有群组</div>';els.groupList.querySelectorAll('[data-group-id]').forEach(b=>b.onclick=()=>setGroup(Number(b.dataset.groupId)));}
    async function loadFoods(){const groupId=currentGroupId;try{const data=await api('/api/foods');if(currentGroupId!==groupId)return;foods=data.foods||[];renderFoods();updateStats();setStatus(els.importStatus,`已同步 ${foods.length} 条群组餐厅数据`,'ok');}catch{if(currentGroupId!==groupId)return;foods=[];renderFoods();setStatus(els.importStatus,'数据库连接失败，请确认服务已启动','fail');}} function renderFoods(){const kw=(els.search.value||'').trim().toLowerCase(),cat=els.category.value,cats=[...new Set(foods.map(f=>f.category||'未分类'))];els.category.innerHTML='<option value="">全部类型</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');els.category.value=cat;const rows=foods.filter(f=>(!kw||f.name.toLowerCase().includes(kw))&&(!cat||f.category===cat));els.listLen.textContent=`(${foods.length})`;els.listWrap.innerHTML=rows.length?rows.map(f=>{const rating=Number(f.rating)||0,ratings=Number(f.rating_count)||0,visits=Number(f.visit_count)||0,myRating=Number(f.my_rating)||0,featured=rating>=4||visits>=2;return `<article class="restaurant-card"><div class="r-top"><div><div class="restaurant-name">${esc(f.name)} ${featured?'<span class="tag featured">群精选</span>':''}</div><div class="meta">📁 ${esc(f.category||'未分类')}　⭐ ${rating?rating.toFixed(1):'暂无'}　👥 ${ratings} 人评分</div></div><div class="r-actions"><button class="outline-btn" data-pick="${f.id}">抽选</button><button class="danger-btn" data-del="${f.id}">删除</button></div></div><div class="rating-row"><div class="stars" aria-label="给${esc(f.name)}评分">${[1,2,3,4,5].map(n=>`<button class="star ${n<=myRating?'selected':''}" data-rate="${f.id}" data-score="${n}" aria-label="${n}星">★</button>`).join('')}</div><span class="rating-copy">我的评分 ${myRating?`${myRating} 星`:'未评分'}</span></div><div class="card-foot"><span class="tag">${esc(f.category||'未分类')}</span><button class="visit-btn" data-visit="${f.id}">✓ 去过一次 · 共 ${visits} 次</button></div></article>`;}).join(''):'<div class="empty">还没有餐厅，先添加一个吧～</div>';els.listWrap.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pickOne(Number(b.dataset.pick)));els.listWrap.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteFood(Number(b.dataset.del)));els.listWrap.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rateFood(Number(b.dataset.rate),Number(b.dataset.score)));els.listWrap.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>recordVisit(Number(b.dataset.visit)));}
    async function rateFood(id,score){try{await api(`/api/foods/${id}/rating`,{method:'POST',body:JSON.stringify(memberPayload({score}))});await Promise.all([loadFoods(),loadMembers()]);setStatus(els.importStatus,`已提交 ${score} 星评分，群友都能看到`,'ok');}catch{setStatus(els.importStatus,'评分失败，请重试','fail');}} async function recordVisit(id){try{await api(`/api/foods/${id}/visits`,{method:'POST',body:JSON.stringify(memberPayload())});await Promise.all([loadFoods(),loadMembers()]);setStatus(els.importStatus,'已记录去过一次，群组到访次数已更新','ok');}catch{setStatus(els.importStatus,'记录到访失败，请重试','fail');}}
    function pickOne(id){if(isPicking)return;if(!foods.length){els.result.textContent='当前群还没有餐厅，请先添加';els.result.classList.remove('highlight');return;}const food=id?foods.find(f=>f.id===id):foods[Math.floor(Math.random()*foods.length)];if(!food)return;isPicking=true;document.querySelectorAll('.pick-main,.quick').forEach(b=>b.disabled=true);els.dice.classList.remove('rolling');void els.dice.offsetWidth;els.dice.classList.add('rolling');els.result.classList.remove('highlight');els.result.textContent='正在摇骰子…';els.countTip.textContent=`${foods.length} 个选项随机中`;let dots=0;const ticker=setInterval(()=>{dots=(dots+1)%4;els.result.textContent=`正在摇骰子${'.'.repeat(dots)}`;},150);setTimeout(()=>{clearInterval(ticker);els.dice.classList.remove('rolling');els.result.textContent=`今天就吃：${food.name}`;els.result.classList.add('highlight');els.countTip.textContent=`${food.category||'未分类'} · 来自「${currentGroup()?.name||'当前群'}」`;const h=groupHistory();h.unshift({name:food.name,category:food.category||'未分类',at:new Date().toISOString()});saveHistory(h);updateStats();renderHistory();isPicking=false;document.querySelectorAll('.pick-main,.quick').forEach(b=>b.disabled=false);},2050);}
    async function addFood(){const name=$('nameInput').value.trim(),category=$('catInput').value.trim()||'未分类';if(!name){setStatus(els.importStatus,'请输入名称','warn');return;}try{await api('/api/foods',{method:'POST',body:JSON.stringify({name,category})});$('nameInput').value='';$('catInput').value='';$('addPanel').style.display='none';await loadFoods();}catch{setStatus(els.importStatus,'添加失败','fail');}} async function deleteFood(id){try{await api(`/api/foods/${id}`,{method:'DELETE'});await loadFoods();}catch{setStatus(els.importStatus,'删除失败','fail');}}
    function parseCSV(text){const lines=text.trim().split(/\r?\n/).filter(Boolean);if(!lines.length)return[];const head=lines[0].split(',').map(x=>x.trim().toLowerCase()),hasHead=head.includes('name');return(hasHead?lines.slice(1):lines).map(line=>{const a=line.split(',').map(x=>x.trim()),n=hasHead?a[head.indexOf('name')]:a[0];if(!n)return null;return{name:n,category:hasHead?(a[head.indexOf('category')]||'未分类'):(a[1]||'未分类')};}).filter(Boolean);} async function importFile(){const f=$('fileInput').files?.[0];if(!f){setStatus(els.importStatus,'请先选择文件','warn');return;}try{const txt=await f.text();let next=f.name.toLowerCase().endsWith('.json')?JSON.parse(txt):parseCSV(txt);if(!Array.isArray(next)||!next.length)throw Error();next=next.map(x=>typeof x==='string'?{name:x,category:'未分类'}:x).filter(x=>x?.name);await api('/api/foods/import',{method:'POST',body:JSON.stringify(next)});await loadFoods();setStatus(els.importStatus,`已导入 ${next.length} 条`,'ok');}catch{setStatus(els.importStatus,'导入失败，请检查 JSON/CSV 格式','fail');}} async function exportFile(){try{const data=await api('/api/foods/export');const blob=new Blob([JSON.stringify(data.foods||[],null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`foods-${currentGroupId}.json`;a.click();URL.revokeObjectURL(a.href);}catch{setStatus(els.importStatus,'导出失败','fail');}}
    function updateStats(){els.mealTotal.textContent=foods.length;els.pickTotal.textContent=foods.reduce((sum,f)=>sum+(Number(f.visit_count)||0),0);const rows=foods.filter(f=>Number(f.rating)||Number(f.visit_count)).slice().sort((a,b)=>(Number(b.rating)||0)-(Number(a.rating)||0)||(Number(b.visit_count)||0)-(Number(a.visit_count)||0)).slice(0,5);els.rankList.innerHTML=rows.length?rows.map(f=>`<div class="rank"><span>${esc(f.name)}</span><b>⭐ ${Number(f.rating)?Number(f.rating).toFixed(1):'暂无'} · ${Number(f.visit_count)||0} 次</b></div>`).join(''):'<div class="empty" style="padding:12px 0">群里还没有评分或到访记录</div>';} function renderHistory(){const h=groupHistory();els.historyList.innerHTML=h.length?h.map(x=>`<div class="history-item"><div><strong>${esc(x.name)}</strong><small style="display:block;margin-top:4px">${esc(x.category||'未分类')}</small></div><small>${new Date(x.at).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</small></div>`).join(''):'<div class="empty">还没有历史记录</div>';} function showView(view){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.dataset.view===view));document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.target===view));if(view==='stats')updateStats();if(view==='history')renderHistory();}
    async function copyText(text,message){try{await navigator.clipboard.writeText(text);setStatus(els.groupStatus,message,'ok');}catch{setStatus(els.groupStatus,'复制失败，请长按群码手动复制','warn');}} function copyCode(){const group=currentGroup();if(group)copyText(group.code,'群码已复制，可以发给吃饭搭子。');} function copyInvite(){const group=currentGroup();if(!group)return;const linkBase=location.origin.startsWith('file:')?'http://localhost:3000':location.origin;copyText(`来加入「${group.name}」一起吃饭吧！打开 ${linkBase}/，输入群码：${group.code}`, '邀请文案已复制。');} async function createGroup(){const name=$('newGroupName').value.trim(),code=$('newGroupCode').value.trim();if(!name){setStatus(els.groupStatus,'群名不能为空','warn');return;}try{const data=await api('/api/groups',{method:'POST',body:JSON.stringify({name,...(code?{code}:{}),...memberPayload()})});$('newGroupName').value='';$('newGroupCode').value='';await loadGroups(data.group.id);setStatus(els.groupStatus,`已创建「${data.group.name}」，群码：${data.group.code}`,'ok');}catch{setStatus(els.groupStatus,'创建失败，群码可能已经存在','fail');}} async function joinGroup(){const code=$('joinCode').value.trim();if(!code){setStatus(els.groupStatus,'请输入群码','warn');return;}try{const data=await api('/api/groups/join-by-code',{method:'POST',body:JSON.stringify(memberPayload({groupCode:code}))});const i=groups.findIndex(g=>g.id===data.group.id);if(i>=0)groups[i]=data.group;else groups.push(data.group);$('joinCode').value='';await setGroup(data.group.id);setStatus(els.groupStatus,`已加入「${data.group.name}」`,'ok');}catch{setStatus(els.groupStatus,'没有找到这个群码，或加入失败','fail');}}
    document.querySelectorAll('.nav-btn').forEach(b=>b.onclick=()=>showView(b.dataset.target));$('pickBtn').onclick=()=>pickOne();$('quickPickBtn').onclick=()=>pickOne();$('rerollBtn').onclick=()=>pickOne();$('doneBtn').onclick=()=>{if(els.result.classList.contains('highlight'))setStatus(els.importStatus,'已记录到历史','ok');};$('showAddBtn').onclick=()=>{const p=$('addPanel');p.style.display=p.style.display==='none'?'grid':'none';};$('addBtn').onclick=addFood;$('importBtn').onclick=importFile;$('exportBtn').onclick=exportFile;els.search.oninput=renderFoods;els.category.onchange=renderFoods;$('groupOpenBtn').onclick=()=>{els.groupBackdrop.classList.add('open');renderGroupList();loadMembers();};$('closeGroupBtn').onclick=()=>els.groupBackdrop.classList.remove('open');els.groupBackdrop.onclick=e=>{if(e.target===els.groupBackdrop)els.groupBackdrop.classList.remove('open');};$('copyCodeBtn').onclick=copyCode;$('copyInviteBtn').onclick=copyInvite;$('inviteBtn').onclick=copyInvite;$('createGroupBtn').onclick=createGroup;$('joinGroupBtn').onclick=joinGroup;$('clearHistoryBtn').onclick=()=>{saveHistory([]);renderHistory();updateStats();};$('helpBtn').onclick=()=>alert('每个吃饭群有独立餐厅库。点击群组入口可复制群码或邀请文案，成员输入群码后就能看到同一套精选餐厅。');
    (async()=>{try{await loadGroups();renderHistory();const inviteCode=new URLSearchParams(location.search).get('groupCode');if(inviteCode){$('joinCode').value=inviteCode;els.groupBackdrop.classList.add('open');}}catch{setStatus(els.groupStatus,'无法连接后端，请运行 npm start','fail');}})();
  </script>
